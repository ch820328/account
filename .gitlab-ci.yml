stages:
  - validate
  - test
  - build

default:
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.9.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

variables:
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  BETTER_AUTH_SECRET: ci-secret-key-1234567890-test-suite

typecheck:
  stage: validate
  script:
    - pnpm typecheck

unit-tests:
  stage: test
  script:
    - pnpm test

web-build:
  stage: build
  script:
    - pnpm --filter @acc/web build
  artifacts:
    paths:
      - apps/web/.next
    expire_in: 1 day
